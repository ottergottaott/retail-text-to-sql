services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: ${RETAIL_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://retail:${POSTGRES_PASSWORD}@postgres:5432/retail
      RETAIL_MODE: ${RETAIL_MODE:-fixture}
      LOG_PATH: /data/events.jsonl
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - application-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  webui:
    image: ghcr.io/open-webui/open-webui:v0.13.4-slim
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "false"
      ENABLE_SIGNUP: "true"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      HF_HUB_OFFLINE: "1"
    volumes:
      - webui-data:/app/backend/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  application-data:
  webui-data:
